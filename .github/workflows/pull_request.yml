name: Typescript for Pull Requests

# Se ejecuta cada vez que se abre o actualiza un Pull Request hacia master
on:
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # el original usaba '14': ahi los tests fallan porque fetch no existe

      - name: Install dependencies
        run: npm install

      - name: Lint TypeScript
        run: npm run lint

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Unit Test TypeScript
        run: npm run test:unit
